<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">

<title>کەشوهەوای جیهان 🌍</title>
<style>

*{box-sizing:border-box;margin:0}

.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:22px;margin-inline-end:auto}
#qf{display:flex;border-radius:14px;overflow:hidden;flex:1 1 200px;max-width:340px}
#qi{flex:1;background:none;border:0;padding:11px 14px;outline:0;min-width:0}
#qf button{background:none;border:0;padding:0 14px;cursor:pointer}
.sg{display:flex;border-radius:14px;overflow:hidden}
.sg button{background:none;border:0;padding:10px 13px;color:var(--mu);font-weight:600;cursor:pointer}
.sg button.on{background:var(--a);color:#03121c}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#pn{position:fixed;top:78px;inset-inline-end:18px;width:min(372px,calc(100vw - 36px));max-height:calc(100% - 178px);overflow:auto;padding:22px;border-radius:24px;z-index:4;animation:in .7s both}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.mu{color:var(--mu)}.sm{font-size:12px;display:flex;justify-content:space-between}
.tp{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h2{font-size:24px}h3{font-size:13px;color:var(--mu);margin:20px 0 8px;font-weight:600}
.bd{font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(76,201,240,.14);color:var(--a);white-space:nowrap}
.big{display:flex;align-items:center;gap:14px;margin:8px 0 2px}.big i{font-size:58px;font-style:normal}.big b{font-size:68px;font-weight:200;letter-spacing:-2px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.ce{padding:11px 6px;border-radius:14px;background:rgba(255,255,255,.06);text-align:center;display:grid;gap:3px;font-size:18px}.ce small{font-size:11px;color:var(--mu)}.ce b{font-size:13px}
.sp{width:100%;height:70px;display:block}
.dy{display:grid;grid-template-columns:1fr 36px 48px 48px;align-items:center;padding:7px 0;border-top:1px solid var(--ln);font-size:14px}.dy i{font-style:normal;font-size:20px}
.hn{text-align:center;padding:12px 4px}.hn div{font-size:46px;margin-bottom:6px}
.ld{width:34px;height:34px;border:3px solid var(--ln);border-top-color:var(--a);border-radius:50%;margin:40px auto;animation:sn 1s linear infinite}@keyframes sn{to{transform:rotate(360deg)}}
#cb{position:fixed;bottom:12px;inset-inline:12px;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:4px;scrollbar-width:none}
#cb::-webkit-scrollbar{display:none}
.ch{flex:none;padding:9px 14px;border-radius:99px;cursor:pointer;font-size:13px;white-space:nowrap}
.ch:hover,.ch.on{border-color:var(--a)}
#lc{position:fixed;bottom:66px;inset-inline-start:18px;z-index:4;display:flex;gap:8px;align-items:center;padding:7px 12px;border-radius:99px;font-size:13px}
#lc i{width:120px;height:6px;border-radius:9px;background:linear-gradient(90deg,hsl(240,100%,60%),hsl(180,100%,60%),hsl(120,100%,60%),hsl(60,100%,60%),hsl(0,100%,60%))}
#tp{position:fixed;z-index:9;pointer-events:none;padding:6px 11px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .15s}
#lb{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;display:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;background:rgba(4,9,20,.72);white-space:nowrap}
#zb{position:fixed;inset-inline-start:18px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
#zb button{background:none;border:0;width:44px;height:44px;font-size:24px;cursor:pointer}
#zb button+button{border-top:1px solid var(--ln)}
#zb button:hover{background:rgba(255,255,255,.08)}
@media(max-width:720px){#pn{top:auto;bottom:62px;inset-inline:12px;width:auto;max-height:42vh}#lc{display:none}.logo{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

let fly=()=>{},paint=()=>{},addMk=()=>{},mark=()=>{};

/* ڕووکار و داتا */
const chips=()=>$('cb').innerHTML=K.map((c,i)=>`<button class="ch g${i==sel?' on':''}" onclick="pick(${i})">${c.w!=null?EM[wc(c.w)]:'📍'} ${c.n} <b>${c.t!=null?tm(c.t):''}</b></button>`).join('');
const hint=()=>$('pn').innerHTML=`<div class="hn"><div>🌍</div><p class="mu">${L.hint}</p></div>`;
function render(){if(!cur)return;const[c,d]=cur,u=d.current,D=d.daily,k=wc(u.weather_code),

$('pn').innerHTML=`<div class="tp"><div><h2>${c.n}</h2><p class="mu sm" style="justify-content:flex-start">🕐 ${u.time.slice(-5)}</p></div><span class="bd">● ${d.demo?L.demo:L.live}</span></div>
